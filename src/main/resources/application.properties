# Supabase PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# Change to 'update' if tables don't exist yet, or 'none' to disable schema validation
# Use 'validate' only when your database schema matches your entities exactly
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Hibernate Naming Strategy - Maps Java camelCase to database snake_case
# Note: Explicit @Column(name = "...") annotations take precedence over naming strategy
spring.jpa.hibernate.naming.physical-strategy=com.zetta.config.CamelCaseToSnakeCaseNamingStrategy

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Jackson JSON Configuration - Accepts and sends snake_case JSON
# Configured via JacksonConfig class - accepts snake_case JSON and converts to camelCase Java fields
spring.jackson.mapper.accept-case-insensitive-enums=true

# Supabase Configuration
supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8080}

# Server port
server.port=${PORT:8080}

